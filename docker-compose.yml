services:
  api:
    build:
      context: .
      dockerfile: src/MyAccountingApp.Api/Dockerfile
    container_name: myaccountingapp-api
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./csv:/app/csv
      - ./import:/app/import
      - ./logs:/app/logs
    environment:
      - CURRENCY_API_KEY=${CURRENCY_API_KEY}
